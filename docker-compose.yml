services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geoworker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geoworker}
      POSTGRES_DB: ${POSTGRES_DB:-geoworker}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 로컬에서 DB 에 직접 접속하려면 주석 해제
    # ports:
    #   - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-geoworker}:${POSTGRES_PASSWORD:-geoworker}@db:5432/${POSTGRES_DB:-geoworker}?sslmode=disable
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      ADMIN_LOCATION_RATIO: ${ADMIN_LOCATION_RATIO:-0.2}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
